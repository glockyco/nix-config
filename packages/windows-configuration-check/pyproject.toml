[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-configuration-check"
version = "0.1.0"
description = "Validate rendered Windows workstation configuration"
requires-python = ">=3.11"

[project.scripts]
windows-configuration-check = "windows_configuration_check:entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windows_configuration_check = ["parse.ps1", "winget-configuration.schema.json"]
