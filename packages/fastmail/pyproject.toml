[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmail"
version = "0.1.0"
description = "Query Fastmail mail and DMARC reports over JMAP"
requires-python = ">=3.11"

[project.scripts]
fastmail = "fastmail:main"

[tool.setuptools.packages.find]
where = ["src"]
