name: update

on:
  schedule:
    # Saturdays, 05:00 UTC, so the pull request is waiting at the start of the
    # weekend rather than the work week.
    - cron: "0 5 * * 6"
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # update-flake-lock no longer installs Nix itself.
      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "Bump flake inputs"
          pr-body: |
            Automated `nix flake update`.

            `check.yml` does not run on branches pushed with the default
            workflow token, so close and reopen this pull request to get a
            `nix flake check` run before merging.
