name: update

on:
  schedule:
    # Saturdays, 05:00 UTC, so the pull request is waiting at the start of the
    # weekend rather than the work week.
    # Runbook: docs/operations/dependency-updates.md
    - cron: "0 5 * * 6"
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # update-flake-lock no longer installs Nix itself.
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Create dependency updater token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-flake-lock
          commit-msg: "chore(deps): update flake inputs"
          pr-title: "chore(deps): update flake inputs"
          pr-body: |
            Automated complete `flake.lock` update.

            This pull request is review-only. Both required platform checks must pass before merge.
