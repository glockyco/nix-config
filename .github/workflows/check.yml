name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.classify.outputs.nix }}
      windows: ${{ steps.classify.outputs.windows }}
      docs: ${{ steps.classify.outputs.docs }}
      openspec: ${{ steps.classify.outputs.openspec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the complete PR diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          affected = dict.fromkeys(("nix", "windows", "docs", "openspec"), False)
          full = os.environ["EVENT_NAME"] != "pull_request"
          if not full:
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  f'{os.environ["BASE_SHA"]}...{os.environ["HEAD_SHA"]}',
              ]).decode("utf-8").split("\0")
              for path in filter(None, paths):
                  classified = False
                  # These include content read by fleetSurface, chezmoi and
                  # formatting checks.
                  if (
                      path.endswith(".nix")
                      or path in ("flake.lock", "formatting.json", ".chezmoiroot")
                      or path.startswith((
                          "flake-modules/", "modules/", "hosts/", "packages/",
                          "checks/", "lib/", "overlays/", "dns/", "home/", "openspec/",
                      ))
                  ):
                      affected["nix"] = classified = True
                  if path.startswith(("windows/", "home/")) or path in ("formatting.json", "lefthook.yml", ".chezmoiroot", ".gitattributes"):
                      affected["windows"] = classified = True
                  if path.endswith((".md", ".markdown")) and not path.startswith(("home/", "openspec/")):
                      affected["docs"] = classified = True
                  if path.startswith("openspec/"):
                      affected["openspec"] = classified = True
                  if path.startswith(".github/") or not classified:
                      full = True
          if full:
              affected = dict.fromkeys(affected, True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for job, needed in affected.items():
                  print(f"{job}={str(needed).lower()}", file=output)
                  print(f"{job}={str(needed).lower()}")
          PY

  openspec:
    permissions:
      contents: read
    uses: glockyco/omp-agent-setup/.github/workflows/openspec.yml@8f4244aff44891de4490d1455e2a745e412aa639 # v0.7.6
    with:
      openspec-root: '.'

  darwin:
    name: check (macos-15)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    # Static job names preserve both required contexts even when Nix is skipped.
    # `nix flake check` covers only the runner's own system.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No FlakeHub Cache: it needs a registered FlakeHub account and fails the
      # login otherwise. The Numtide cache is what actually matters here, since
      # it serves the llm-agents packages that would otherwise build from
      # source. `modules/shared/binary-caches.nix` is the source for these values.
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Reject uncached source toolchains and language servers before building
      # repository checks. This app needs store access outside a check sandbox.
      - run: nix run .#check-darwin-build-plans

      - run: nix flake check --print-build-logs

  linux:
    name: check (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - run: nix flake check --print-build-logs

  windows:
    name: check (windows-latest)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.docs == 'true')
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require changed-file classification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if ($env:CHANGES_RESULT -cne 'success') {
            throw "Changed-file classification did not succeed: $env:CHANGES_RESULT"
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cache only hash-reviewed archives and exact-version engine modules.
      # Restores have no fallback keys. Bootstrap validates their contents.
      - name: Cache locked development archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-dev-archives
          key: windows-dev-archives-${{ hashFiles('windows/dev/dependencies.lock.json') }}

      - name: Cache pinned local engine modules
        if: needs.changes.outputs.windows == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.git/engine-modules
          key: windows-engine-modules-pwsh7-${{ hashFiles('windows/dev/engine-dependencies.ps1') }}

      - name: Bootstrap locked native formatters
        env:
          WINDOWS_AFFECTED: ${{ needs.changes.outputs.windows }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            .\windows\dev\bootstrap.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -SkipHook `
              -IncludeTestDependencies:($env:WINDOWS_AFFECTED -eq 'true') `
              -ArchiveCacheRoot "$env:RUNNER_TEMP\native-dev-archives"
          }
          finally { Write-Host ('timing: gate formatter bootstrap {0:F3}s' -f $timer.Elapsed.TotalSeconds) }

      # Shared formatting runs once, including documentation-only diffs.
      - name: Shared native formatting check
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try { .\windows\dev\format.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Check }
          finally { Write-Host ('timing: gate native formatting {0:F3}s' -f $timer.Elapsed.TotalSeconds) }

      # Runner pwsh, Git and SSH are used as-is. No WinGet, DSC, alternate host
      # provisioning, elevation or production engine application runs in CI.
      - name: Complete PowerShell 7 static and isolated fixture gates
        if: needs.changes.outputs.windows == 'true'
        run: |
          .\windows\dev\ci.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ArchiveCacheRoot "$env:RUNNER_TEMP\native-dev-archives"
