name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `nix flake check` only checks the runner's own system, so the fleet needs
    # one runner per system in `systems`. The macOS 14 and newer labels are
    # Apple Silicon; `ubuntu-latest` covers `x86_64-linux`.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No FlakeHub Cache: it needs a registered FlakeHub account and fails the
      # login otherwise. The Numtide cache is what actually matters here, since
      # it serves the llm-agents packages that would otherwise build from
      # source. `modules/shared/binary-caches.nix` is the source for these values.
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Use the patched derivation, not the whole lock or application version.
      - name: Select Plannotator cache identity
        id: plannotator-cache-key
        shell: bash
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          installable=".#packages.${system}.personal-omp.plannotator"
          derivation=$(nix eval --raw "${installable}.drvPath")
          printf '%s\n' \
            "installable=$installable" \
            "derivation=$derivation" \
            "key=plannotator-v1-${system}-${derivation##*/}" | tee -a "$GITHUB_OUTPUT"

      # v7 supports Determinate Nix; it requires Nix >= 2.24 and SQLite >= 3.37.
      # Cache only store paths and their database, not installer metadata or tokens.
      # Exact keys retain GitHub's normal branch and pull-request visibility.
      - name: Restore Plannotator store cache
        id: plannotator-cache-restore
        continue-on-error: true
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.plannotator-cache-key.outputs.key }}
          paths: |
            !/nix
            /nix/store
            /nix/var/nix/db

      # Reject uncached source toolchains and language servers before building
      # repository checks. This app needs store access outside a check sandbox.
      - if: runner.os == 'macOS'
        run: nix run .#check-darwin-build-plans

      # Build on hits and misses. This output link retains the closure during GC.
      - name: Build and root Plannotator
        env:
          PLANNOTATOR: ${{ steps.plannotator-cache-key.outputs.installable }}
        run: nix build "$PLANNOTATOR" --print-build-logs --out-link "$RUNNER_TEMP/plannotator"

      # On macOS this builds `darwinSystem`; on Linux it is the host closure,
      # the module-import and the formatting checks. Evaluation errors, build
      # failures, an unimported module and unformatted files all fail here.
      #
      # Each leg runs the Nix that its host runs, because `nix flake check` is
      # implementation-sensitive: revision f24e147 passed on this runner under
      # Determinate Nix and failed on the WSL host under the pinned Nix, which
      # refuses to evaluate a package whose `meta.platforms` excludes the
      # system. The macOS runner and the Darwin host both use Determinate Nix,
      # so only the Linux leg has to fetch its host's Nix.
      - if: runner.os == 'macOS'
        run: nix flake check --print-build-logs

      - if: runner.os == 'Linux'
        run: |
          nix build .#nixosConfigurations.korolev.config.nix.package --out-link "$RUNNER_TEMP/host-nix"
          "$RUNNER_TEMP/host-nix/bin/nix" \
            --extra-experimental-features 'nix-command flakes' \
            flake check --print-build-logs

      # No post-job save: a failed guard, build, or check must not publish a cache.
      # The 2 GiB target applies only here; live roots can exceed it.
      - name: Save checked Plannotator store cache
        if: success() && steps.plannotator-cache-restore.outputs.hit-primary-key != 'true'
        continue-on-error: true
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.plannotator-cache-key.outputs.key }}
          paths: |
            !/nix
            /nix/store
            /nix/var/nix/db
          gc-max-store-size: 2G
