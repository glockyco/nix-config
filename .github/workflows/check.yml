name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `nix flake check` only checks the runner's own system, so the fleet needs
    # one runner per system in `systems`. The macOS 14 and newer labels are
    # Apple Silicon; `ubuntu-latest` covers `x86_64-linux`.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No FlakeHub Cache: it needs a registered FlakeHub account and fails the
      # login otherwise. The Numtide cache is what actually matters here, since
      # it serves the llm-agents packages that would otherwise build from
      # source. It mirrors `determinateNix.customSettings` in modules/darwin/nix.nix.
      - uses: DeterminateSystems/determinate-nix-action@668647a33843b1f280cb2ef4c41736f86b29f826 # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # On macOS this builds `darwinSystem`; on Linux it is the module-import
      # and formatting checks. Evaluation errors, build failures, an unimported
      # module and unformatted files all fail here.
      - run: nix flake check --print-build-logs
