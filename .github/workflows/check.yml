name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.classify.outputs.nix }}
      windows: ${{ steps.classify.outputs.windows }}
      docs: ${{ steps.classify.outputs.docs }}
      openspec: ${{ steps.classify.outputs.openspec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the complete PR diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          affected = dict.fromkeys(("nix", "windows", "docs", "openspec"), False)
          full = os.environ["EVENT_NAME"] != "pull_request"
          if not full:
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  f'{os.environ["BASE_SHA"]}...{os.environ["HEAD_SHA"]}',
              ]).decode("utf-8").split("\0")
              for path in filter(None, paths):
                  classified = False
                  # These include content read by fleetSurface, OpenSpec and
                  # chezmoi checks, plus the remote-access runbook assertion.
                  if (
                      path.endswith(".nix")
                      or path in ("flake.lock", "formatting.json", ".chezmoiroot")
                      or path.startswith((
                          "flake-modules/", "modules/", "hosts/", "packages/",
                          "checks/", "lib/", "overlays/", "dns/", "home/", "openspec/",
                      ))
                      or path == "docs/operations/korolev-remote-access.md"
                  ):
                      affected["nix"] = classified = True
                  if path.startswith(("windows/", "home/")) or path in ("formatting.json", "lefthook.yml"):
                      affected["windows"] = classified = True
                  if path.endswith((".md", ".markdown")) and not path.startswith(("home/", "openspec/")):
                      affected["docs"] = classified = True
                  if path.startswith("openspec/"):
                      affected["openspec"] = classified = True
                  if path.startswith(".github/") or not classified:
                      full = True
          if full:
              affected = dict.fromkeys(affected, True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for job, needed in affected.items():
                  print(f"{job}={str(needed).lower()}", file=output)
                  print(f"{job}={str(needed).lower()}")
          PY

  openspec:
    permissions:
      contents: read
    uses: glockyco/omp-agent-setup/.github/workflows/openspec.yml@aa97a3febee50f00ee7e4e43a81edc211ad7f8d7 # v0.4.0
    with:
      openspec-root: '.'

  darwin:
    name: check (macos-15)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    # Static job names preserve both required contexts even when Nix is skipped.
    # `nix flake check` covers only the runner's own system.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No FlakeHub Cache: it needs a registered FlakeHub account and fails the
      # login otherwise. The Numtide cache is what actually matters here, since
      # it serves the llm-agents packages that would otherwise build from
      # source. `modules/shared/binary-caches.nix` is the source for these values.
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Reject uncached source toolchains and language servers before building
      # repository checks. This app needs store access outside a check sandbox.
      - run: nix run .#check-darwin-build-plans

      - run: nix flake check --print-build-logs

  linux:
    name: check (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Linux retains its host's Nix implementation until WSL retirement.
      # Determinate Nix previously accepted an output that this pin rejected.
      - run: |
          nix build .#nixosConfigurations.korolev.config.nix.package --out-link "$RUNNER_TEMP/host-nix"
          "$RUNNER_TEMP/host-nix/bin/nix" \
            --extra-experimental-features 'nix-command flakes' \
            flake check --print-build-logs

  windows-engine:
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.docs == 'true'
    name: Windows engine (PowerShell 7)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache locked development archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/native-dev-archives
          key: windows-dev-archives-${{ hashFiles('windows/dev/dependencies.lock.json') }}

      - name: Cache pinned engine modules
        if: needs.changes.outputs.windows == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/engine-modules
          key: windows-engine-modules-pwsh7-${{ hashFiles('windows/dev/engine-dependencies.ps1') }}

      - name: Bootstrap locked native formatters
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try { .\windows\dev\bootstrap.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -SkipHook -ArchiveCacheRoot "$env:RUNNER_TEMP\native-dev-archives" }
          finally { Write-Host ("timing: gate formatter bootstrap {0:F3}s" -f $timer.Elapsed.TotalSeconds) }

      # Shared formatting runs once, never in either legacy fixture job.
      - name: Shared native formatting check
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try { .\windows\dev\format.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Check }
          finally { Write-Host ("timing: gate native formatting {0:F3}s" -f $timer.Elapsed.TotalSeconds) }

      - name: Restore pinned local Pester and analyzer
        if: needs.changes.outputs.windows == 'true'
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try { .\windows\dev\engine-dependencies.ps1 -ModuleRoot "$env:RUNNER_TEMP\engine-modules" }
          finally { Write-Host ("timing: gate engine dependency setup {0:F3}s" -f $timer.Elapsed.TotalSeconds) }

      # No WinGet/DSC provisioners, alternate host ZIP or live engine invocation.
      - name: Workstation static and mocked checks
        if: needs.changes.outputs.windows == 'true'
        run: .\windows\check-workstation.ps1 -ModuleRoot "$env:RUNNER_TEMP\engine-modules"

  windows-ps51:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows gates (PowerShell 5.1)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cache only release archives, never extracted tools or AppX registrations.
      # Exact lock keys have no fallback; provisioning rechecks every archive hash.
      - name: Cache locked runner archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/native-ci-archives
          key: windows-ci-archives-${{ hashFiles('windows/dev/ci-dependencies.json') }}

      - name: Cache locked development archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/native-dev-archives
          key: windows-dev-archives-${{ hashFiles('windows/dev/dependencies.lock.json') }}

      # Runner-only, hash-locked test dependencies. No workstation resources,
      # configuration apply, production profiles, credentials or enrollment.
      - name: Provision locked native test dependencies
        shell: powershell
        run: .\windows\dev\ci-provision.ps1 -ArchiveCacheRoot "$env:RUNNER_TEMP\native-ci-archives"

      - name: Native gates on Windows PowerShell 5.1
        shell: powershell
        run: .\windows\dev\ci.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -ArchiveCacheRoot "$env:RUNNER_TEMP\native-dev-archives"

  windows-ps7:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows gates (locked PowerShell 7)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache locked runner archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/native-ci-archives
          key: windows-ci-archives-${{ hashFiles('windows/dev/ci-dependencies.json') }}

      - name: Cache locked development archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/native-dev-archives
          key: windows-dev-archives-${{ hashFiles('windows/dev/dependencies.lock.json') }}

      - name: Provision locked native test dependencies
        shell: powershell
        run: .\windows\dev\ci-provision.ps1 -ArchiveCacheRoot "$env:RUNNER_TEMP\native-ci-archives"

      - name: Native gates on locked PowerShell 7
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\native-check\powershell\pwsh.exe" `
            -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\windows\dev\ci.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ArchiveCacheRoot "$env:RUNNER_TEMP\native-dev-archives"
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 native gate exited $LASTEXITCODE" }

  windows:
    name: check (windows-latest)
    needs: [changes, windows-engine, windows-ps51, windows-ps7]
    if: always()
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Require every affected Windows gate to succeed
        shell: powershell
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_AFFECTED: ${{ needs.changes.outputs.windows }}
          WINDOWS_ENGINE_RESULT: ${{ needs.windows-engine.result }}
          WINDOWS_PS51_RESULT: ${{ needs.windows-ps51.result }}
          WINDOWS_PS7_RESULT: ${{ needs.windows-ps7.result }}
        run: |
          if ($env:CHANGES_RESULT -cne 'success') {
            throw "Changed-file classification did not succeed: $env:CHANGES_RESULT"
          }
          $results = @($env:WINDOWS_ENGINE_RESULT, $env:WINDOWS_PS51_RESULT, $env:WINDOWS_PS7_RESULT)
          foreach ($result in $results) {
            if ($result -ceq 'success') { continue }
            if ($result -ceq 'skipped' -and $env:WINDOWS_AFFECTED -ceq 'false') { continue }
            throw "Windows gates did not all succeed: engine/formatting=$env:WINDOWS_ENGINE_RESULT; PowerShell 5.1=$env:WINDOWS_PS51_RESULT; PowerShell 7=$env:WINDOWS_PS7_RESULT"
          }
