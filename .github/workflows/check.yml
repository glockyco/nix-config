name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This flake only ever builds `aarch64-darwin`, so the runner has to be
    # Apple Silicon; the standard macOS 14 and newer labels are.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # No FlakeHub Cache: it needs a registered FlakeHub account and fails the
      # login otherwise. The Numtide cache is what actually matters here, since
      # it serves the llm-agents packages that would otherwise build from
      # source. It mirrors `determinateNix.customSettings` in modules/darwin/nix.nix.
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Builds `darwinSystem`, so evaluation errors, build failures, an
      # unimported module and unformatted files all fail here.
      - run: nix flake check --print-build-logs
