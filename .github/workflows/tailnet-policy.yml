name: tailnet-policy

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tailnet-policy-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@668647a33843b1f280cb2ef4c41736f86b29f826 # v3
      - run: nix build .#tailnet-policy
      - uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ secrets.TS_TEST_OAUTH_ID }}
          audience: ${{ secrets.TS_TEST_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: result/policy.hujson
          action: test
      - name: Verify PR authorization boundaries
        env:
          TS_TEST_OAUTH_ID: ${{ secrets.TS_TEST_OAUTH_ID }}
          TS_TEST_AUDIENCE: ${{ secrets.TS_TEST_AUDIENCE }}
          TS_OAUTH_ID: ${{ secrets.TS_OAUTH_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_TAILNET: ${{ secrets.TS_TAILNET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def request(url, headers, data=None):
              try:
                  response = urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers, data=data), timeout=30
                  )
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, response.read()

          def exchange(client, audience):
              status, body = request(
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience="
                  + urllib.parse.quote(audience, safe=""),
                  {"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
              )
              if status != 200:
                  raise SystemExit(f"GitHub OIDC request failed: HTTP {status}")
              payload = urllib.parse.urlencode({
                  "client_id": client, "jwt": json.loads(body)["value"]
              }).encode()
              return request(
                  "https://api.tailscale.com/api/v2/oauth/token-exchange",
                  {"Content-Type": "application/x-www-form-urlencoded"}, payload,
              )

          status, body = exchange(os.environ["TS_TEST_OAUTH_ID"], os.environ["TS_TEST_AUDIENCE"])
          if status != 200:
              raise SystemExit(f"Validation identity exchange failed: HTTP {status}")
          token = json.loads(body)["access_token"]
          status, _ = request(
              "https://api.tailscale.com/api/v2/tailnet/"
              + urllib.parse.quote(os.environ["TS_TAILNET"], safe="") + "/acl",
              {"Authorization": "Bearer " + token, "Content-Type": "application/hujson"},
              b"{",
          )
          # Invalid syntax cannot replace policy even if authorization regresses.
          if status != 403:
              raise SystemExit(f"Expected policy-write authorization denial, got HTTP {status}")
          print("Validation token cannot write policy (HTTP 403).")

          status, _ = exchange(os.environ["TS_OAUTH_ID"], os.environ["TS_AUDIENCE"])
          if status not in (401, 403):
              raise SystemExit(f"Expected deployment identity rejection, got HTTP {status}")
          print(f"Deployment identity rejects the PR token (HTTP {status}).")
          PY

  apply:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tailnet-policy-apply
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@668647a33843b1f280cb2ef4c41736f86b29f826 # v3
      - run: nix build .#tailnet-policy
      - name: Check deployment revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$CHECKED_SHA" == "$current_sha" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Not applying an obsolete main revision.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        if: steps.revision.outputs.current == 'true'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: result/policy.hujson
          action: apply
