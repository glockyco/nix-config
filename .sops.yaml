# Recipients allowed to decrypt each secrets file.
#
# The matching private key is generated per machine and never leaves it:
#   age-keygen -o ~/.config/sops/age/keys.txt
# A second machine gets its own key, and its public half is added here.
#
# `encrypted_regex` keeps the YAML keys readable so diffs stay reviewable;
# only the values are encrypted.
keys:
  - &macbook-pro age1nkezccfyk8xrj6xnwppr0cca9mm80j2gkuxndseamfq76px2a52s98vn93

creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    encrypted_regex: "^(token|password|secret)$"
    key_groups:
      - age:
          - *macbook-pro
