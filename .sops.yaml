# Only the Mac recipient can decrypt these files. Its private key lives at
# ~/.config/sops/age/keys.txt and is never committed.
#
# `encrypted_regex` encrypts only values under these key names. Every current
# data value uses one of them, and `checks/secret-encryption-check.nix` rejects
# any plaintext data value that a new key name would leave behind.
keys:
  - &macbook-pro age1nkezccfyk8xrj6xnwppr0cca9mm80j2gkuxndseamfq76px2a52s98vn93

creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    encrypted_regex: "^(token|password|secret)$"
    key_groups:
      - age:
          - *macbook-pro
