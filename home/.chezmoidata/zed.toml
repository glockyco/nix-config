[zed]
fontFamily = "JetBrainsMonoNL Nerd Font"
windowsFontFamily = "JetBrainsMonoNL NF"
themeName = "Catppuccin Mocha"

[zed.settings]
buffer_font_size = 14
vim_mode = true
base_keymap = "VSCode"
ui_font_size = 16
show_edit_predictions = false
diff_view_style = "unified"

[zed.platforms.darwin.auto_install_extensions]
latex = true

# Native Windows does not select a Nix server or a WSL transport.
[zed.platforms.windows.languages.Nix]
language_servers = []
