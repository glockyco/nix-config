[ssh]
tailnetDnsDomain = "tail8768af.ts.net"
secretiveAgent = "~/Library/Containers/com.maxgoedjen.Secretive.SecretAgent/Data/socket.ssh"
userIdentityFile = "~/.ssh/id_ed25519"
yubikeyIdentityFile = "~/.ssh/id_ed25519_sk"

[ssh.batch]
BatchMode = "yes"
RequestTTY = "no"
ControlMaster = "no"
ControlPath = "none"
ControlPersist = "no"
ConnectTimeout = 8

[ssh.interactive]
AddKeysToAgent = "no"
ControlMaster = "auto"
ControlPath = "~/.ssh/master-%C"
ControlPersist = "1h"
HashKnownHosts = "yes"
ServerAliveInterval = 60
ServerAliveCountMax = 3

[ssh.desktop]
hostName = "desktop"
user = "User"
publicKey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN/+XoGCH3MVvNQuvVfjmidMk5mEa+gqs84C00s6DiEt"
fingerprint = "SHA256:ZYFVPT8M8AJI7Vmq63k018DCGIIJKA8atz3xQ6TI4Lw"

# The second personal desktop's host key, read from its own C:\ProgramData\ssh over
# an authenticated session.
[ssh.desktop-ac]
hostName = "desktop-ac"
user = "hho_h"
publicKey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPf4H/HKs6jh/LKW1ZBquROZHDpIT84SNICtbfGY/6kO"
fingerprint = "SHA256:jYEG4vrFrvlRDuZqxFPbq1NCGcM1LIWNUGtMhv5lR94"
# In-box Windows OpenSSH 9.5, as on Korolev.
warnWeakCrypto = "no-pq-kex"

# Korolev's host key as printed at its console by windows/apply-openssh.ps1.
[ssh.korolev]
hostName = "korolev"
user = 'scch\jglock'
publicKey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBAJLe8i/0kyLTYNA5s0k74kxZLH6JdFBHMCnpYIgEpP"
fingerprint = "SHA256:ysbk01MVWS8ee/yB6scrochgc0CjjwU7pVknlRoUZg8"
